[project]
name = "dynlp-plus"
version = "0.1.0"
description = "Certified dynamic label propagation (DynLP+) research prototype"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# required (GPU only): pick the one matching `nvidia-smi` -> "CUDA Version"
cu12 = ["cupy-cuda12x>=13.0"]
cu13 = ["cupy-cuda13x>=14.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dynlp"]

[tool.uv]
conflicts = [[{ extra = "cu12" }, { extra = "cu13" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:cupyx.*"]
